[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg", "unzip", "nodejs_20"]

[phases.install]
cmds = [
  "npm install",
  "pip install yt-dlp yt-dlp-ejs --break-system-packages",
  "curl -fsSL https://deno.land/install.sh | sh",
  "cp /root/.deno/bin/deno /usr/local/bin/deno",
  "cp $(which yt-dlp) /usr/local/bin/yt-dlp"
]

[start]
cmd = "node server.js"